name: Zenvest CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zenvest_ci
          POSTGRES_PASSWORD: zenvest_ci_only
          POSTGRES_DB: zenvest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenvest_ci -d zenvest_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://zenvest_ci:zenvest_ci_only@localhost:5432/zenvest_ci?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - name: Apply all migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Seed deterministic test-only records
        run: node scripts/seed-ci.mjs
      - name: Run integration and unit tests with combined coverage
        run: npm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs
      - name: Publish coverage on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('coverage/coverage-summary.json')) return;
            const report = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const marker = '<!-- zenvest-coverage-report -->';
            const metrics = ['lines', 'branches', 'functions', 'statements'];
            const rows = metrics.map(k => '| ' + k + ' | ' + report.total[k].pct.toFixed(2) + '% |');
            const body = [marker, '## Zenvest test coverage', '', '| Metric | Coverage |', '|---|---:|', ...rows, '', 'Source: CI run ' + context.runId + ', commit ' + context.sha.slice(0, 7), 'CI requires at least 85% source line coverage and 80% branch coverage.'].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const previous = comments.find(x => x.user?.type === 'Bot' && x.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenvest-coverage
          path: |
            coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: npm run typecheck
      - run: npm run build
      - name: Verify built HTTP financial endpoint security
        run: node scripts/check-http-routes.mjs

  migrate-production:
    name: Apply production database migrations
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: zenvest-production-db-migrations
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Prisma CLI
        run: npm install --no-audit --no-fund
      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set DATABASE_URL in GitHub repository Actions secrets."
            exit 1
          fi
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Check migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status
      - name: Seed market presentation records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/seed-strategy-design.mjs
