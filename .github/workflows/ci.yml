name: Zenvest CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zenvest_ci
          POSTGRES_PASSWORD: zenvest_ci_only
          POSTGRES_DB: zenvest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenvest_ci -d zenvest_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://zenvest_ci:zenvest_ci_only@localhost:5432/zenvest_ci?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - name: Apply all migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Seed deterministic test-only records
        run: node scripts/seed-ci.mjs
      - name: Run PostgreSQL integration assertions
        run: node scripts/check-ci-db.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  migrate-production:
    name: Apply production database migrations
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: zenvest-production-db-migrations
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Prisma CLI
        run: npm install --no-audit --no-fund
      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set DATABASE_URL in GitHub repository Actions secrets."
            exit 1
          fi
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Check migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status
