<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">A winding path through an illustrated green landscape</title>
<desc id="desc">Layered rolling hills and rows of trees around a pale winding road.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#FBF9F1"/><stop offset=".55" stop-color="#F4F4E9"/><stop offset="1" stop-color="#F2F4E7"/></linearGradient>
 <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5ECCF"/><stop offset="1" stop-color="#CADBAD"/></linearGradient>
 <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D2DDB6"/><stop offset="1" stop-color="#AECB98"/></linearGradient>
 <linearGradient id="hill3" x2="1" y2="1"><stop stop-color="#B7D09F"/><stop offset="1" stop-color="#8DAE86"/></linearGradient>
 <linearGradient id="road" x2="1" y2="1"><stop stop-color="#FFFEF4"/><stop offset="1" stop-color="#F6F5E7"/></linearGradient>
 <symbol id="pine" viewBox="0 0 48 108"><path d="M23 8L11 48h7L5 75h11L0 94h46L31 75h12L29 48h7Z" fill="#537D60"/><path d="M23 8L23 94H1L16 75H5l13-27h-7Z" fill="#6F9B73"/><path d="M22 93h5v15h-5Z" fill="#866F5E"/></symbol>
 <symbol id="pine2" viewBox="0 0 48 108"><path d="M23 8L11 48h7L5 75h11L0 94h46L31 75h12L29 48h7Z" fill="#87A476"/><path d="M23 8L23 94H1L16 75H5l13-27h-7Z" fill="#A1BC8A"/><path d="M22 93h5v15h-5Z" fill="#866F5E"/></symbol>
